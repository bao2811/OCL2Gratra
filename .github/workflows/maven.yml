# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Check machine verification contract
        shell: pwsh
        run: |
          ./verification/scripts/check-verification-contract.ps1 `
            -RequireGitTracked
          ./verification/scripts/check-verification-contract-mutations.ps1
      - name: Check Lean mechanized proof
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/lean
          build: true
          test: false
          use-mathlib-cache: false
          leanchecker: true
          # lean-action #169: its nanoda runner currently combines the new
          # lean4export NDJSON stream with nanoda's stale debug parser.
          nanoda: false
      - name: Check Lean proof with pinned nanoda
        shell: bash
        run: bash ./verification/scripts/check-nanoda.sh
      - name: Check mechanization contract and mutations
        shell: pwsh
        run: |
          ./verification/scripts/check-mechanized-proof.ps1
          ./verification/scripts/check-mechanized-proof-mutations.ps1
      - name: Install bundled Kodkod artifact
        working-directory: validator
        run: ./init.sh
      - name: Build reactor artifacts
        # Legacy USE integration tests are not the OCL2Cypher proof gate and
        # currently contain platform-sensitive golden-output cases. The next
        # step runs the explicit 261-test implementation conformance suite.
        run: mvn --batch-mode --update-snapshots -Dmaven.test.skip=true install
      - name: Check proof and implementation conformance
        shell: pwsh
        run: ./verification/scripts/check-implementation-conformance.ps1
      - name: Write machine verification report
        shell: pwsh
        run: |
          ./verification/scripts/write-proof-report.ps1 `
            -GateResult PASS `
            -OutputPath "${{ runner.temp }}/proof-verification/proof-report.json"
      - name: Upload machine verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: proof-contract-PC-2026-07-22.2
          path: |
            ${{ runner.temp }}/proof-verification
            verification/contract/proof-contract-registry.json
            verification/evidence/*.tsv
          if-no-files-found: error
      - name: Upload build result
        run: mkdir staging && cp use-assembly/target/*.zip staging
      - uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging
